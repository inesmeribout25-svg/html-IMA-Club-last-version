<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Classes</title>
<link rel="stylesheet" href="style-admin-dashboard.css">
</head>
<body>

<nav class="navbar">
    <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="admin-classes.html" class="active">Classes</a></li>
    </ul>
</nav>

<div class="dashboard-container">

<h2 class="section-title">Add Class</h2>

<form id="classForm">
    <input type="text" id="name" placeholder="Class Name" required>
    <input type="text" id="trainer" placeholder="Trainer" required>

    <select id="day">
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
    </select>

    <input type="time" id="time" required>

    <button type="submit">Add Class</button>
</form>

<h2 class="section-title">Classes List</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Trainer</th>
<th>Day</th>
<th>Time</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="classTable"></tbody>

</table>

</div>

<script src="script-classes.js"></script>

</body>
</html>
